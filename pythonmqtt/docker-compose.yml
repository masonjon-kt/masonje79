services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: tunapos-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-tunaposuser}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-tunapospass}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/password_file:/mosquitto/config/password_file
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    command: >
      sh -c "
      if [ ! -s /mosquitto/config/password_file ]; then
        mosquitto_passwd -b -c /mosquitto/config/password_file \"$MQTT_USERNAME\" \"$MQTT_PASSWORD\";
      fi;
      exec mosquitto -c /mosquitto/config/mosquitto.conf
      "

volumes:
  mosquitto_data:
  mosquitto_log:
